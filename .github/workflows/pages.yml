name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: litec-courses/course-tooling/.github/workflows/publish-pages.yml@v0.9.0
    with:
      config-path: portal.yml
      base-path: /
      install-chromium: false
